name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Lint · Test · Build (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/edge-functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/edge-functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

  typecheck-mobile:
    name: Typecheck (Mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    name: Deploy (Netlify)
    if: github.ref == 'refs/heads/main'
    needs: [test-backend, typecheck-mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Backend → Netlify Functions (monorepo-root deploy: backend/edge-functions)
      - name: Deploy Edge Functions
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: backend/edge-functions
          deploy-message: "Deploy edge functions"
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_BACKEND_SITE_ID }}

      # 2. Mobile web build → Netlify static site
      - name: Build mobile web
        working-directory: apps/mobile
        run: |
          npm ci
          npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Deploy mobile web
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: apps/mobile/dist
          deploy-message: "Deploy mobile web"
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_SITE_ID }}
